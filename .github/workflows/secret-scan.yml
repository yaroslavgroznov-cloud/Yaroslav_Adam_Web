# Секрет-скан PR: обязательная проверка шлюза слияния (_control/shlyuz_sliyaniya.py vliv).
# Источник шаблона — этот файл в Стеке; в остальные репо Дома он копируется без правок.
#
# 14.10.2026, брат СС (Волна 1 канона развития): всё, что исполняется, закреплено
# неизменяемо. Прежняя версия брала `trufflesecurity/trufflehog@main` и образ `:latest`:
# переписанный тег или ветка (как атака на trivy-action 19.03.2026) исполнялась бы
# в CI с правом чтения репо. Теперь:
#   actions/checkout  -> полный SHA коммита релиза v4.4.0
#   образ trufflehog  -> digest манифест-листа тега 3.97.9 (v3.97.9 вышел 24.09.2026)
# Сам action trufflehog не используется: он внутри делает `docker run IMAGE:latest`,
# и SHA action'а образ не закрепляет. Тот же запуск написан здесь, но по digest.
# Обновлять: новый тег -> `docker buildx imagetools inspect ghcr.io/trufflesecurity/trufflehog:<тег>`
# и `gh api repos/actions/checkout/git/ref/tags/<тег>`; брать релизы старше двух недель.
name: Secret scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db # 3.97.9

jobs:
  trufflehog-diff:
    name: Trufflehog (diff)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trufflehog OSS (коммиты PR или push)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi
          ARGS=(git file:///repo --branch "$HEAD" --fail --no-update --github-actions --results=verified,unknown)
          # новая ветка (before = нули): сканируем всю историю до HEAD
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            ARGS+=(--since-commit "$BASE")
          fi
          docker run --rm -v "$PWD":/repo -w /repo "$TRUFFLEHOG_IMAGE" "${ARGS[@]}"

  trufflehog-full:
    name: Trufflehog (full tree)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trufflehog filesystem scan
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/repo "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --results=verified,unknown --fail --no-update
