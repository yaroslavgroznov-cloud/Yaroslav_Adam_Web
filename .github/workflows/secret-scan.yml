# Канонический шаблон secret-scan Дома. Все копии синхронизируются побайтно.
# TZ-2026-10-25-01: full tree означает полную историю до выбранного HEAD.
# Значения находок обрабатываются только доверенным процессом, вывод — sha8/путь.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db # 3.97.9

jobs:
  trufflehog:
    name: Trufflehog (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full tree' || 'diff' }})
    # Одинаковый шаблон работает и на нестандартных default branches зеркал.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trufflehog history scan (sha8/path only)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          event = os.environ["EVENT"]
          head = os.environ.get("PR_HEAD") if event == "pull_request" else os.environ["GITHUB_SHA"]
          base = os.environ.get("PR_BASE") if event == "pull_request" else os.environ.get("PUSH_BEFORE")
          full = event in ("schedule", "workflow_dispatch")
          if not head or not re.fullmatch(r"[0-9a-fA-F]{40}", head):
              print("NE_SMOG: invalid head")
              sys.exit(2)
          args = ["git", "file:///repo", "--branch", head, "--fail", "--fail-on-scan-errors",
                  "--no-update", "--json", "--no-verification", "--results=verified,unknown,unverified"]
          if not full and base and base != "0" * 40:
              if not re.fullmatch(r"[0-9a-fA-F]{40}", base):
                  print("NE_SMOG: invalid base")
                  sys.exit(2)
              args += ["--since-commit", base]
          cmd = ["docker", "run", "--rm", "--network", "none", "-u", f"{os.getuid()}:{os.getgid()}",
                 "-e", "HOME=/tmp", "-v", os.getcwd() + ":/repo:ro", os.environ["TRUFFLEHOG_IMAGE"]] + args
          try:
              scan = subprocess.run(cmd, capture_output=True, text=True, timeout=1500, check=False)
          except (OSError, subprocess.TimeoutExpired):
              print("NE_SMOG: scanner unavailable or timed out")
              sys.exit(2)
          # Raw/RawV2 and stderr never reach logs, artifacts or GITHUB_STEP_SUMMARY.
          findings = []
          invalid = False
          for line in scan.stdout.splitlines():
              if not line.strip():
                  continue
              try:
                  row = json.loads(line)
                  raw = row.get("Raw") or row.get("RawV2")
                  meta = row["SourceMetadata"]["Data"]["Git"]
                  path = meta["file"]
                  if not isinstance(raw, str) or not raw or not isinstance(path, str) or not path:
                      raise ValueError("invalid finding")
                  findings.append({"sha8": hashlib.sha256(raw.encode()).hexdigest()[:8], "path": path})
              except (ValueError, KeyError, TypeError, AttributeError):
                  invalid = True
          chunks = [int(n) for n in re.findall(r'"chunks"\s*:\s*(\d+)', scan.stderr)]
          errors = False
          for line in scan.stderr.splitlines():
              try:
                  log = json.loads(line)
                  errors |= isinstance(log, dict) and log.get("level") in ("error", "fatal", "panic")
              except ValueError:
                  # Unstructured diagnostics are not echoed. Exit code/chunks remain mandatory.
                  pass
          valid = not invalid and not errors and bool(chunks) and chunks[-1] > 0
          valid &= (scan.returncode == 0 and not findings) or (scan.returncode == 183 and bool(findings))
          status = "NE_SMOG" if not valid else ("FOUND" if findings else "CLEAN")
          summary = {"status": status, "mode": "full_history" if full else "diff",
                     "head": head, "rc": scan.returncode, "chunks": chunks[-1] if chunks else None,
                     "findings": findings}
          safe = json.dumps(summary, ensure_ascii=True, sort_keys=True)
          print(safe)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("Secret scan (values suppressed):\n\n```json\n" + safe + "\n```\n")
          sys.exit(2 if not valid else (1 if findings else 0))
